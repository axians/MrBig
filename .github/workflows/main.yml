name: Build and Release MrBig

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Cygwin (with MinGW toolchains)
      uses: cygwin/cygwin-install-action@master
      with:
        # include mingw packages so prefixed toolchains are available under /usr/bin
        platform: x86_64
        packages: |
          make zip gcc-core gcc-g++ binutils 
          mingw64-x86_64-gcc-core mingw64-x86_64-binutils mingw64-x86_64-gcc-g++ 
          mingw64-i686-gcc-core mingw64-i686-binutils mingw64-i686-gcc-g++
      
    - name: Build MrBig
      shell: C:\cygwin\bin\bash.exe --login --norc -eo pipefail -o igncr '{0}'
      run: |
        cd "$GITHUB_WORKSPACE"
        echo "Building MrBig"
        make all
        
    - name: Verify built binaries
      shell: C:\cygwin\bin\bash.exe --login --norc -eo pipefail -o igncr '{0}'
      run: |
        cd "$GITHUB_WORKSPACE"
        echo "Verifying built binaries"
        file X86/mrbig.exe || echo "X86/mrbig.exe not found"
        file X64/mrbig64.exe || echo "X64/mrbig64.exe not found"
        echo "Listing build directories:"
        ls -l X86 
        ls -l X64

    - name: Create release archive
      if: startsWith(github.ref, 'refs/tags/')
      shell: C:\cygwin\bin\bash.exe --login --norc -eo pipefail -o igncr '{0}'
      run: |
        mkdir -p release
        # Copy built binaries to release directory
        if [ -f "mrbig.exe" ]; then
          cp mrbig.exe release/
        fi
        if [ -d "X64" ] && [ -f "X64/mrbig64.exe" ]; then
          cp X64/mrbig64.exe release/mrbig64.exe
        fi
        if [ -d "X86" ] && [ -f "X86/mrbig.exe" ]; then
          cp X86/mrbig.exe release/mrbig.exe
        fi
        
    - name: Upload build artifacts
      if: github.event_name == 'release'
      uses: actions/upload-artifact@v4
      with:
        name: mrbig-binaries
        path: |
          X64/mrbig64.exe
          X86/mrbig.exe
        if-no-files-found: warn

    - name: Upload Release Assets
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          X64/mrbig64.exe
          X86/mrbig.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

