name: release-build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install MinGW cross-compilers
      run: |
        sudo apt-get update
        sudo apt-get install -y make mingw-w64 binutils-mingw-w64 zip

    - name: Verify tag matches Makefile version
      if: github.event_name == 'release'
      run: |
        TAG="${GITHUB_REF_NAME#v}"
        MAKEFILE_VERSION=$(grep -m1 '^VERSION=' Makefile | cut -d= -f2)
        if [ "$TAG" != "$MAKEFILE_VERSION" ]; then
          echo "Tag version ($TAG) does not match Makefile version ($MAKEFILE_VERSION)"
          exit 1
        fi

    - name: Build MrBig
      run: |
        TAG="${GITHUB_REF_NAME#v}"
        if [ "${{ github.event_name }}" = "release" ] && [ -n "$TAG" ]; then
          make all VERSION="$TAG"
        else
          make all
        fi

    - name: Upload build artifacts
      if: github.event_name == 'release'
      uses: actions/upload-artifact@v7
      with:
        name: mrbig-binaries
        path: |
          X64/mrbig64.exe
          X86/mrbig.exe
        if-no-files-found: warn

    - name: Upload Release Assets
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v3
      with:
        files: |
          X64/mrbig64.exe
          X86/mrbig.exe
