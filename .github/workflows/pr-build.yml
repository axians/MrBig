name: PR Build and Artifact

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    # Triggers on all PR events (opened, synchronize, reopened, etc.)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install MinGW cross-compilers
      run: |
        sudo apt-get update
        sudo apt-get install -y make mingw-w64

    - name: Build MrBig
      run: make all

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mrbig-binaries
        path: |
          X64/mrbig64.exe
          X86/mrbig.exe
        if-no-files-found: warn

    - name: Comment artifact link on PR
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
      uses: actions/github-script@v7
      with:
        script: |
          const pr = context.payload.pull_request;
          if (pr) {
            const runId = process.env.GITHUB_RUN_ID;
            const artifactUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;
            await github.rest.issues.createComment({
              issue_number: pr.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🔗 Download the build artifacts from this PR run: [Artifacts & Logs](${artifactUrl})`
            });
          }
